[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "enzo-mcp"
version = "0.2.0"
description = "Atomic reasoning MCP server that decomposes large LLM questions into independently falsifiable claims for Jev"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = [
  "ai-tools",
  "jev",
  "llm",
  "mcp",
  "model-context-protocol",
  "pydantic",
  "reasoning",
  "semantic-reasoning",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = [
  "mcp>=2.0,<3",
  "pydantic>=2.11,<3",
  "pydantic-ai-slim[typesafe]>=2.45,<3",
]

[project.urls]
Homepage = "https://github.com/mahawi1992/enzo-mcp"
Repository = "https://github.com/mahawi1992/enzo-mcp"
Issues = "https://github.com/mahawi1992/enzo-mcp/issues"

[project.scripts]
enzo-mcp = "enzo_mcp.server:main"

[dependency-groups]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/enzo_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["enzo_mcp"]
